[tool.poetry]
name = "extractcontentfrompdf"
version = "0.1.0"
description = "Extracao e sanitizacao de conteudo textual de PDFs nativos"
authors = ["Márcio Lima <marciocad@gmail.com>"]
readme = "README.md"
packages = [{ include = "extractcontentfrompdf", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
pdfplumber = "^0.11.7"
pypdf = "^6.12.2"

[tool.poetry.scripts]
extract-pdf = "extractcontentfrompdf.cli:main"
extract-pdf-hierarchical = "extractcontentfrompdf.hierarchical_batch_cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
poethepoet = "^0.33.1"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --cov=extractcontentfrompdf --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true

[tool.poe.tasks]
test = "pytest"
coverage = "pytest --cov=extractcontentfrompdf --cov-report=term-missing --cov-report=html"
check = "pytest"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
