[tool.poetry]
name = "extractcontentfrompdf"
version = "0.1.0"
description = "Extracao e sanitizacao de conteudo textual de PDFs nativos"
authors = ["Márcio Lima <marciocad@gmail.com>"]
readme = "README.md"
packages = [{ include = "extractcontentfrompdf", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
pdfplumber = "^0.11.7"

[tool.poetry.scripts]
extract-pdf = "extractcontentfrompdf.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --cov=extractcontentfrompdf --cov-report=term-missing --cov-report=html"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
